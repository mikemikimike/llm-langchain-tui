[project]
name = "llmtui"
version = "0.1.0"
description = "LangChain practice TUI with a self-hosted Ollama model"
requires-python = ">=3.12"
dependencies = [
    "langchain==1.3.15",
    "langchain-community==0.4.2",
    "langgraph==1.2.11",
    "langchain-ollama==1.1.0",
    "grandalf==0.8",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langchain-milvus==0.4.0",
    "milvus-lite==3.2.0",
    "pymilvus==3.0.1",
    "pymupdf==1.28.2",
    "tqdm==4.70.0",
    "textual==8.2.8",
    "langchain-mcp-adapters==0.3.2",
]

[tool.uv]
# Flat layout: app.py / scripts/ are run directly, nothing to build or install.
package = false
